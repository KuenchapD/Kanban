<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Kanban Board</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
.who{color:#e6ecf5;font-size:13px;font-weight:600;max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
:root{--bg1:#0c66e4;--bg2:#5e4db2;--list:#f1f2f4;--card:#fff;--ink:#172b4d;--mute:#626f86;--line:#dcdfe4;--accent:#0c66e4;--shadow:0 1px 1px rgba(9,30,66,.25);
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--list:#101204;--card:#22272b;--ink:#c7d1db;--mute:#8c9bab;--line:#38414a;--shadow:0 1px 1px rgba(0,0,0,.5);--bg1:#0a3d91;--bg2:#352c63}}
:root[data-theme="dark"]{--list:#101204;--card:#22272b;--ink:#c7d1db;--mute:#8c9bab;--line:#38414a;--shadow:0 1px 1px rgba(0,0,0,.5);--bg1:#0a3d91;--bg2:#352c63}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font:14px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--ink);background:linear-gradient(135deg,var(--bg1),var(--bg2));display:flex;flex-direction:column;overflow:hidden}
header{display:flex;align-items:center;gap:12px;padding:10px 16px;background:rgba(0,0,0,.28);color:#fff}
header h1{font-size:18px;margin:0;font-weight:700}
header input{margin-left:auto;padding:6px 10px;border-radius:4px;border:0;background:rgba(255,255,255,.25);color:#fff;width:160px}
header input::placeholder{color:#e6ecf5}
header button{background:rgba(255,255,255,.25);color:#fff;border:0;border-radius:4px;padding:6px 10px;cursor:pointer}
#board{flex:1;display:flex;gap:12px;padding:12px 16px;overflow-x:auto;align-items:flex-start}
.list{flex:0 0 272px;max-width:272px;background:var(--list);border-radius:12px;padding:8px;display:flex;flex-direction:column;max-height:100%}
.list.over{outline:2px dashed var(--accent)}
.lh{display:flex;align-items:center;padding:4px 6px 8px}
.lh input{flex:1;background:transparent;border:2px solid transparent;border-radius:4px;font:inherit;font-weight:600;color:var(--ink);padding:3px 6px}
.lh input:focus{background:var(--card);border-color:var(--accent);outline:0}
.count{color:var(--mute);font-size:12px;margin:0 4px}
.x{background:none;border:0;color:var(--mute);cursor:pointer;font-size:16px;border-radius:4px;padding:2px 6px}
.x:hover{background:var(--line)}
.cards{overflow-y:auto;display:flex;flex-direction:column;gap:8px;padding:2px;min-height:8px}
.card{background:var(--card);border-radius:8px;box-shadow:var(--shadow);padding:8px 10px;cursor:grab;position:relative;border:2px solid transparent}
.card:hover{border-color:var(--accent)}
.card.drag{opacity:.4}
.card .t{word-break:break-word}
.tags{display:flex;gap:4px;margin-bottom:6px;flex-wrap:wrap}
.tag{height:8px;width:40px;border-radius:4px}
.meta{font-size:12px;color:var(--mute);margin-top:6px}
.card .x{position:absolute;top:4px;right:4px;display:none;font-size:13px}
.card:hover .x{display:block}
.add{margin-top:8px}
.add>button{width:100%;text-align:left;background:none;border:0;color:var(--mute);padding:6px 8px;border-radius:6px;cursor:pointer;font:inherit}
.add>button:hover{background:var(--line)}
.form{display:flex;flex-direction:column;gap:6px}
.form textarea,.newlist input{width:100%;border:0;border-radius:8px;padding:8px;font:inherit;color:var(--ink);background:var(--card);box-shadow:var(--shadow);resize:none}
.row{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.primary{background:var(--accent);color:#fff;border:0;border-radius:4px;padding:6px 12px;cursor:pointer;font:inherit}
.dot{width:20px;height:20px;border-radius:50%;border:2px solid transparent;cursor:pointer;padding:0}
.dot.on{border-color:var(--ink)}
.newlist{flex:0 0 272px;background:rgba(255,255,255,.24);border-radius:12px;padding:8px}
.newlist>button{width:100%;text-align:left;background:none;border:0;color:#fff;padding:6px;cursor:pointer;font:inherit}
.hide{display:none!important}
.fld{flex:1;min-width:0;border:0;border-radius:6px;padding:5px 6px;font:inherit;color:var(--ink);background:var(--card);box-shadow:var(--shadow)}
.cimg{width:100%;max-height:160px;object-fit:cover;border-radius:6px;margin-bottom:6px;display:block}
.chips{display:flex;gap:6px;margin-top:6px;flex-wrap:wrap}
.cl{margin-top:6px}
.bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin-bottom:6px}
.bar span{display:block;height:100%;background:#1f845a}
.ci{display:flex;align-items:center;gap:6px;padding:2px 0;cursor:pointer}
.ci span.done{text-decoration:line-through;color:var(--mute)}
.ci span{flex:1;word-break:break-word}
.rmi{background:none;border:0;color:var(--mute);cursor:pointer;border-radius:4px;padding:0 4px}
.rmi:hover{background:var(--line)}
.ci input[type=checkbox]{width:16px;height:16px;margin:0;flex:none;accent-color:var(--accent);cursor:pointer}
.cl .fld{width:100%;margin-top:4px;box-shadow:none;border:1px solid var(--line)}
.addcl{background:none;border:0;color:var(--mute);cursor:pointer;font:inherit;font-size:12px;padding:4px 0 0}
.addcl:hover{color:var(--accent)}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;padding:16px;z-index:200}
.modal{background:var(--list);color:var(--ink);border-radius:12px;padding:16px;width:100%;max-width:420px;max-height:90vh;overflow:auto;display:flex;flex-direction:column;gap:8px}
.card{cursor:pointer}
#board.cal{display:block;overflow:auto;padding:12px 16px}
.calw{background:var(--list);border-radius:12px;padding:12px;min-width:640px}
.calbar{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.calbar h2{margin:0 0 0 8px;font-size:18px}
.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.dow{text-align:center;color:var(--mute);font-size:12px;padding:2px}
.day{min-height:96px;background:var(--card);border-radius:6px;padding:4px;display:flex;flex-direction:column;gap:3px;min-width:0}
.day.off{opacity:.55}
.day.today{outline:2px solid var(--accent)}
.day.over{background:var(--line)}
.dn{font-size:12px;color:var(--mute)}
.cchip{font-size:12px;padding:2px 6px;border-radius:4px;background:var(--line);border-left:4px solid var(--mute);cursor:pointer;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cchip.blk{outline:1px dashed #e56910}
.cchip.conf{outline:1px solid #c9372c}
.unsch{margin-top:12px}
header select{background:rgba(255,255,255,.25);color:#fff;border:0;border-radius:4px;padding:6px 8px;font:inherit}
header select option{color:#172b4d}
.chip.st-started{background:#579dff;color:#082145}.chip.st-progress{background:#8f7ee7;color:#1e1a3f}.chip.st-completed{background:#1f845a;color:#fff}
.gt{background:var(--list);border-radius:12px;padding:8px;overflow:auto}
.gtw{position:relative}
.gtr{display:flex;height:32px;border-bottom:1px solid var(--line)}
.gtl{flex:0 0 200px;position:sticky;left:0;background:var(--list);z-index:2;padding:0 8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;border-right:1px solid var(--line);cursor:pointer;display:flex;align-items:center}
.gtt{position:relative;flex:none;background-image:repeating-linear-gradient(to right,transparent 0,transparent 27px,var(--line) 27px,var(--line) 28px)}
.gtb{position:absolute;top:6px;height:20px;border-radius:4px;color:#fff;font-size:11px;padding:0 6px;line-height:20px;overflow:hidden;white-space:nowrap;cursor:pointer;z-index:1}
.gth{display:flex}
.gtm,.gtd{flex:none;height:19px;line-height:19px;text-align:center;font-size:11px;color:var(--mute);overflow:hidden;white-space:nowrap}
.gtm{border-left:1px solid var(--line);text-align:left;padding-left:4px}
.gtd.we{background:rgba(128,128,128,.15)}
.picbtn{border:1px dashed var(--mute);background:none;color:var(--mute);border-radius:10px;padding:0 8px;font-size:12px;height:20px;cursor:pointer}
.picbtn:hover{color:var(--accent);border-color:var(--accent)}
header{flex-wrap:wrap}
#pj{font-weight:700;font-size:16px;max-width:200px}
header.home>*:not(#pnew):not(#pimp):not(#pexpall):not(#who):not(#plock):not(#ppw){display:none}
.lockov{position:fixed;inset:0;z-index:100;display:flex;align-items:center;justify-content:center;padding:16px;background:linear-gradient(135deg,var(--bg1),var(--bg2))}
.lockcard{background:var(--list);color:var(--ink);border-radius:12px;padding:20px;width:100%;max-width:340px;display:flex;flex-direction:column;gap:10px;box-shadow:0 8px 30px rgba(0,0,0,.35)}
.err{color:#c9372c;font-size:13px;min-height:18px}
header:not(.home) #pimp,header:not(.home) #pexpall{display:none}
.ic{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
button.wi{display:inline-flex;align-items:center;gap:6px}
.swatch{width:32px;height:32px;border-radius:8px;border:2px solid var(--line);cursor:pointer;padding:0}
.swatch:hover{border-color:var(--accent)}
.phome{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
.pcard{text-align:left;background:var(--list);color:var(--ink);border:0;border-radius:12px;padding:14px;cursor:pointer;font:inherit;box-shadow:var(--shadow)}
.pcard:hover{outline:2px solid var(--accent)}
.pcard{position:relative}
.pcard .pn{padding-right:28px}
.kebab{position:absolute;top:8px;right:8px;background:none;border:0;color:var(--mute);cursor:pointer;border-radius:6px;padding:4px;display:flex}
.kebab:hover{background:var(--line);color:var(--ink)}
.pmenu{position:absolute;top:38px;right:8px;background:var(--card);border-radius:8px;box-shadow:0 4px 14px rgba(0,0,0,.35);padding:4px;display:flex;flex-direction:column;gap:2px;z-index:5;min-width:140px}
.pmenu[hidden]{display:none}
header{position:relative;padding-right:56px}
header .hmwrap{position:absolute;top:10px;right:16px}
header .hk{display:flex;padding:6px 8px}
.hmwrap .pmenu{top:36px;right:0;left:auto}
.hmwrap .pmenu button{background:none;color:var(--ink);width:100%;justify-content:flex-start;padding:6px 10px;border-radius:6px;font:inherit;white-space:nowrap}
.hmwrap .pmenu button:hover{background:var(--line)}
.pmenu .x{color:var(--ink);font-size:14px;width:100%;justify-content:flex-start;padding:6px 10px}
.pmenu .x.del{color:#c9372c}
.pcard .pn{font-weight:700;font-size:16px;margin-bottom:4px;word-break:break-word}
.pcard.add{display:flex;align-items:center;justify-content:center;min-height:90px;color:#fff;background:rgba(255,255,255,.24)}
.lpic{width:24px;height:24px;border-radius:6px;object-fit:cover;vertical-align:middle;margin-right:6px}
.deps{max-height:110px;overflow:auto;border:1px solid var(--line);border-radius:8px;padding:4px 6px;background:var(--card)}
.chip{font-size:11px;padding:1px 7px;border-radius:4px;background:var(--line);color:var(--ink)}
.chip.high{background:#c9372c;color:#fff}.chip.med{background:#e56910;color:#fff}.chip.low{background:#1f845a;color:#fff}.chip.late{background:#c9372c;color:#fff}
:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
@media (max-width:600px){.list,.newlist{flex-basis:84vw;max-width:84vw}header input{width:110px}}
</style>
</head>
<body>
<header><button id="phome">Projects</button><select id="pj" aria-label="Project"></select><button id="pnew">New</button><button id="pimp">Import</button><button id="pexpall">Export all</button><button id="pcopy">Copy</button><button id="pren" style="display:none">Rename</button><button id="pdel" style="display:none">Delete</button><button id="psave">Save</button><select id="vw" aria-label="View"><option value="board">Board</option><option value="cal">Calendar</option><option value="gantt">Gantt chart</option></select><input id="q" placeholder="Filter cards" aria-label="Filter cards"><button id="reset">Reset</button><span id="who" class="who"></span><button id="plock">Sign out</button><button id="ppw">Password</button><div id="hm" class="hmwrap"><button id="hmb" class="hk" aria-label="More options" aria-haspopup="menu" title="More options"></button><div id="hmenu" class="pmenu" hidden><button id="pbg">Background</button><button id="pexp">Export project</button></div></div></header>
<main id="board"></main>
<script>
const COLORS=["#4bce97","#f5cd47","#fea362","#f87168","#9f8fef","#579dff"];
const seed=()=>({lists:[
{id:1,title:"To do",cards:[{id:11,text:"Draft project scope",tags:[5]},{id:12,text:"Review drawings with the team",tags:[1]}]},
{id:2,title:"In progress",cards:[{id:21,text:"Prepare cost plan",tags:[2,3]}]},
{id:3,title:"Review",cards:[]},
{id:4,title:"Done",cards:[{id:41,text:"Set up the board",tags:[0]}]}],next:100});
let S,P;
P={cur:0,next:1,projects:[]};
if(false){let old=null;try{old=JSON.parse(localStorage.getItem("kanban-v1"))}catch(e){}
 P={cur:1,next:2,projects:[{id:1,name:"My project",data:old&&old.lists?old:seed()}]}}
S=seed();
if(!S||!S.lists)S=seed();
const save=()=>{P.at=Date.now();dirty.add(P.cur);schedule();return persist()};
const $=(t,c,h)=>{const e=document.createElement(t);if(c)e.className=c;if(h!=null)e.textContent=h;return e};
let drag=null,filter="",openForm=null,addingList=false;
let showHome=true,focusItem=null,view="board",cm=new Date(new Date().getFullYear(),new Date().getMonth(),1);
const all=()=>S.lists.flatMap(l=>l.cards.map(c=>({c,l})));
const find=id=>all().find(x=>x.c.id===id);
const ST={started:"Started",progress:"In progress",completed:"Completed"};
const isDone=x=>x.l.title.toLowerCase()==="done"||x.c.st==="completed";
const preds=c=>(c.pred||[]).map(find).filter(Boolean);
const succs=c=>all().filter(x=>(x.c.pred||[]).includes(c.id));
const blocked=c=>preds(c).some(x=>!isDone(x));
function shrink(file,cb,mx,q){const r=new FileReader();r.onerror=()=>cb(null);r.onload=()=>{const im=new Image();im.onerror=()=>cb(null);im.onload=()=>{const k=Math.min(1,(mx||480)/Math.max(im.width,im.height));const c=document.createElement("canvas");c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);const cx=c.getContext("2d");cx.fillStyle="#fff";cx.fillRect(0,0,c.width,c.height);cx.drawImage(im,0,0,c.width,c.height);cb(c.toDataURL("image/jpeg",q||.75))};im.src=r.result};r.readAsDataURL(file)}

function render(){
 document.querySelector("header").classList.toggle("home",showHome);
 applyBg();
 if(showHome)return renderHome();
 if(view==="cal")return renderCal();
 if(view==="gantt")return renderGantt();
 document.getElementById("board").className="";
 const b=document.getElementById("board");b.innerHTML="";
 S.lists.forEach(l=>b.append(listEl(l)));
 b.append(newListEl());
 if(openForm!=null){const ta=b.querySelector(".form textarea");if(ta)ta.focus()}
 if(focusItem!=null){const ni=b.querySelector('input[data-cid="'+focusItem+'"]');if(ni)ni.focus();focusItem=null}
}
function listEl(l){
 const el=$("section","list");
 const h=$("div","lh");
 const t=$("input");t.value=l.title;t.setAttribute("aria-label","List title");
 t.onchange=()=>{l.title=t.value.trim()||"Untitled";save()};
 t.onkeydown=e=>{if(e.key==="Enter")t.blur()};
 const n=$("span","count",l.cards.length);
 const d=$("button","x","✕");d.title="Delete list";d.onclick=()=>{const rm=()=>{S.lists=S.lists.filter(x=>x!==l);save();render()};if(!l.cards.length)rm();else dlg("Delete list",{msg:"Delete \u201C"+l.title+"\u201D and its cards?",ok:"Delete"},rm)};
 h.append(t,n,d);el.append(h);
 const cs=$("div","cards");
 l.cards.filter(c=>c.text.toLowerCase().includes(filter)).forEach(c=>cs.append(cardEl(c,l)));
 el.append(cs);
 el.ondragover=e=>{if(!drag)return;e.preventDefault();el.classList.add("over");
  const after=[...cs.querySelectorAll(".card:not(.drag)")].find(c=>e.clientY<c.getBoundingClientRect().top+c.offsetHeight/2);
  const dragEl=document.querySelector(".drag");if(dragEl){after?cs.insertBefore(dragEl,after):cs.append(dragEl)}};
 el.ondragleave=e=>{if(!el.contains(e.relatedTarget))el.classList.remove("over")};
 el.ondrop=e=>{e.preventDefault();if(!drag)return;
  const ids=[...cs.querySelectorAll(".card")].map(c=>+c.dataset.id);
  S.lists.forEach(x=>x.cards=x.cards.filter(c=>c!==drag.card));
  const pos=ids.indexOf(drag.card.id);
  const vis=l.cards.filter(c=>c.text.toLowerCase().includes(filter));
  const nextId=ids[pos+1];const idx=nextId==null?l.cards.length:l.cards.findIndex(c=>c.id===nextId);
  l.cards.splice(idx<0?l.cards.length:idx,0,drag.card);
  drag=null;save();render()};
 const add=$("div","add");
 if(openForm===l.id){
  const f=$("div","form");const ta=$("textarea");ta.rows=3;ta.placeholder="Enter a title for this card";
  let tags=[],pri="",due="",img="",start="";
  const sub=()=>{const v=ta.value.trim();if(v){l.cards.push({id:S.next++,text:v,tags,pri,due,img,start:start||undefined,items:(x=>x.length?x.map(t=>({t,d:false})):undefined)(ci.value.trim()?draft.concat(ci.value.trim()):draft)});save()}openForm=null;render()};
  ta.onkeydown=e=>{if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();sub()}if(e.key==="Escape"){openForm=null;render()}};
  const r=$("div","row");const ok=$("button","primary","Add card");ok.onclick=sub;
  const cancel=$("button","x","✕");cancel.onclick=()=>{openForm=null;render()};
  r.append(ok,cancel);
  const lab=$("div","row");
  COLORS.forEach((c,i)=>{const d=$("button","dot");d.style.background=c;d.title="Label";d.onclick=()=>{tags=tags.includes(i)?tags.filter(x=>x!==i):[...tags,i];d.classList.toggle("on")};lab.append(d)});
  const ex=$("div","row");
  const ps=$("select","fld");ps.setAttribute("aria-label","Priority");[["","Priority"],["low","Low"],["med","Medium"],["high","High"]].forEach(([v,n])=>{const o=$("option",null,n);o.value=v;ps.append(o)});ps.onchange=()=>{pri=ps.value};
  const di=$("input","fld");di.type="date";di.setAttribute("aria-label","Due date");di.onchange=()=>{due=di.value};
  const fi=$("input","fld");fi.type="file";fi.accept="image/*";fi.setAttribute("aria-label","Attach image");
  const note=$("div","meta","");note.style.marginTop="0";
  fi.onchange=()=>{const g=fi.files[0];if(!g)return;shrink(g,d=>{img=d||"";note.textContent=d?"Image attached":"Couldn't read that image"})};
  ex.append(ps,di);
  const draft=[];const dl=$("div","cl");dl.style.margin="0";
  const ci=$("input","fld");ci.placeholder="Checklist item (optional)";ci.setAttribute("aria-label","Checklist item");ci.style.flex="1";
  const paint=()=>{dl.innerHTML="";draft.forEach((t,i)=>{const row=$("label","ci");const bx=$("input");bx.type="checkbox";bx.disabled=true;const tx=$("span",null,t);const rm=$("button","rmi","✕");rm.type="button";rm.onclick=e=>{e.preventDefault();draft.splice(i,1);paint()};row.append(bx,tx,rm);dl.append(row)})};
  const addD=()=>{const v=ci.value.trim();if(v){draft.push(v);ci.value="";paint();ci.focus()}};
  ci.onkeydown=e=>{if(e.key==="Enter"){e.preventDefault();addD()}};
  const cb2=$("button","primary","Add");cb2.onclick=addD;
  const cr=$("div","row");cr.style.flexWrap="nowrap";cr.append(ci,cb2);
  const sdf=$("input","fld");sdf.type="date";sdf.setAttribute("aria-label","Start date");sdf.onchange=()=>{start=sdf.value};
  const hh=t=>{const e=$("div","meta",t);e.style.margin="2px 0 0";return e};
  f.append(ta,lab,hh("Priority"),ps,hh("Start date"),sdf,hh("End date"),di,fi,note,dl,cr,r);add.append(f);
 }else{const bt=$("button",null,"+ Add a card");bt.onclick=()=>{openForm=l.id;render()};add.append(bt)}
 el.append(add);return el;
}
function cardEl(c,l){
 const el=$("div","card");el.draggable=true;el.dataset.id=c.id;el.tabIndex=0;
 if(c.tags&&c.tags.length){const col=COLORS[c.tags[0]];el.style.background="color-mix(in srgb,"+col+" 22%,var(--card))";el.style.boxShadow="inset 6px 0 0 "+col+",0 1px 1px rgba(9,30,66,.25)";}
 if(c.img){const im=$("img","cimg");im.src=c.img;im.alt="Card attachment";el.append(im)}
 const t=$("div","t");if(c.lpic){const lp=$("img","lpic");lp.src=c.lpic;lp.alt="Label picture";t.append(lp)}t.append(document.createTextNode(c.text));el.append(t);
 if(c.pri||c.due){const ch=$("div","chips");
  if(c.pri){ch.append($("span","chip "+c.pri,{low:"Low",med:"Medium",high:"High"}[c.pri]))}
  if(c.due){const today=new Date().toISOString().slice(0,10);const late=c.due<today&&!isDone({c,l});
   ch.append($("span","chip"+(late?" late":""),(late?"Overdue ":"Due ")+new Date(c.due+"T00:00").toLocaleDateString(undefined,{month:"short",day:"numeric"})))}

 const box=$("div",null,code);box.style.cssText="font:700 18px/1.4 ui-monospace,Menlo,Consolas,monospace;letter-spacing:1px;text-align:center;padding:12px;border-radius:8px;background:var(--card);user-select:all;word-break:break-all";
 const cp=$("button","x","Copy");cp.onclick=async()=>{try{await navigator.clipboard.writeText(code);(cp.querySelector("span")||cp).textContent="Copied"}catch(e){}};
 const lab=$("label","ci");const cb=$("input");cb.type="checkbox";lab.append(cb,$("span",null,"I've saved my recovery code"));
 const go=$("button","primary","Continue");go.disabled=true;cb.onchange=()=>{go.disabled=!cb.checked};go.onclick=next;
 c.append(t,$("div","meta","This code is the only way to reset your password if you forget it. It is shown once, so write it down or keep it somewhere safe."),box,cp,lab,go);
}
function acctScreen(mode){
 const users=getUsers();if(mode==="in"&&!users.length)mode="new";
 const c=cardShell();
 const f=(ph,type,ac)=>{const i=$("input","fld");i.type=type||"text";i.placeholder=ph;i.autocomplete=ac||"off";i.setAttribute("aria-label",ph);return i};
 const title={in:"Sign in",new:"Create an account",reset:"Reset password"}[mode];
 const t=$("div",null,title);t.style.cssText="font-weight:700;font-size:18px";
 const un=f("Username","text","username");un.autocapitalize="none";un.spellcheck=false;
 const pw=f(mode==="in"?"Password":"Password (6+ characters)","password",mode==="in"?"current-password":"new-password");
 if(mode==="reset")pw.placeholder="New password (6+ characters)";
 const pw2=f("Repeat password","password","new-password"),rc=f("Recovery code","text","off");rc.autocapitalize="characters";
 if(mode==="in"){const lu=localStorage.getItem("kanban-lastuser");if(lu&&users.includes(lu))un.value=lu}
 const err=$("div","err","");
 const ok=$("button","primary",{in:"Sign in",new:"Create account",reset:"Reset password"}[mode]);
 const BAD="Username or password isn't right.";
 const go=async()=>{err.textContent="";const name=cleanName(un.value);
  if(mode==="in"){
   const a=users.includes(name)?getAcct(name):null;if(!a||!pw.value){err.textContent=BAD;return}
   ok.disabled=true;
   try{const dek=await unwrapDek(a.wp,pw.value,ub64(a.salt));const raw=localStorage.getItem(dataKey(name));let p=raw?JSON.parse(await dec(raw,dek)):null;if(!p||!p.projects||!p.projects.length)p=defaultP();openSession(name,dek,p)}
   catch(e){err.textContent=BAD;ok.disabled=false}
   return}
  if(pw.value.length<6){err.textContent="Use at least 6 characters for the password.";return}
  if(pw.value!==pw2.value){err.textContent="The passwords don't match.";return}
  if(mode==="new"){
   if(!NAME_RE.test(name)){err.textContent="Username: 3 to 30 characters using letters, numbers, dots, dashes or underscores.";return}
   if(users.includes(name)){err.textContent="That username is taken.";return}
   ok.disabled=true;
   try{const dek=await crypto.subtle.generateKey({name:"AES-GCM",length:256},true,["encrypt","decrypt"]);
    const salt=crypto.getRandomValues(new Uint8Array(16)),rs=crypto.getRandomValues(new Uint8Array(16)),code=newRecoveryCode();
    const a={salt:toB64(salt),wp:await wrapDek(dek,pw.value,salt),rs:toB64(rs),wr:await wrapDek(dek,normCode(code),rs)};
    const first=!users.length,p=first?loadPlainP():defaultP();
    KEY=dek;USER=name;P=p;
    if(!(await persist()))throw 0;
    localStorage.setItem(acctKey(name),JSON.stringify(a));localStorage.setItem("kanban-users",JSON.stringify([...users,name]));
    if(first){localStorage.removeItem("kanban-v2");localStorage.removeItem("kanban-v1")}
    recoveryScreen(code,()=>openSession(name,dek,p))}
   catch(e){KEY=null;USER="";ok.disabled=false;err.textContent="Couldn't create the account in this browser."}
   return}
  const BADR="Username or recovery code isn't right.";
  const a=users.includes(name)?getAcct(name):null;if(!a){err.textContent=BADR;return}
  ok.disabled=true;
  try{const dek=await unwrapDek(a.wr,normCode(rc.value),ub64(a.rs));
   const salt=crypto.getRandomValues(new Uint8Array(16));a.salt=toB64(salt);a.wp=await wrapDek(dek,pw.value,salt);
   localStorage.setItem(acctKey(name),JSON.stringify(a));
   const raw=localStorage.getItem(dataKey(name));let p=raw?JSON.parse(await dec(raw,dek)):null;if(!p||!p.projects||!p.projects.length)p=defaultP();
   openSession(name,dek,p)}
  catch(e){err.textContent=BADR;ok.disabled=false}
 };
 ok.onclick=go;
 const inputs=mode==="in"?[un,pw]:mode==="new"?[un,pw,pw2]:[un,rc,pw,pw2];
 inputs.forEach(i=>{i.onkeydown=e=>{if(e.key==="Enter")go()}});
 const msg={in:"Enter your username and password.",new:"Choose a username (no email needed) and a password. Your projects are encrypted in this browser with it. Accounts are stored in this browser only.",reset:"Enter your username, the recovery code you saved when you created the account, and a new password."}[mode];
 c.append(t,$("div","meta",msg),...inputs,err,ok);
 const link=(label,fn)=>{const b=$("button","x",label);b.onclick=fn;c.append(b)};
 if(mode==="in"){link("Create account",()=>acctScreen("new"));link("Forgot password?",()=>acctScreen("reset"))}
 else{if(users.length)link("Back to sign in",()=>acctScreen("in"));
  if(mode==="reset")link("Lost your recovery code? Erase this account",()=>{const name=cleanName(un.value);if(!users.includes(name)){err.textContent="Type your username above first.";return}
   dlg("Erase this account?",{msg:"This deletes the account \u201C"+name+"\u201D and all its projects from this browser. It can't be undone.",ok:"Erase"},()=>{[acctKey(name),dataKey(name)].forEach(k=>localStorage.removeItem(k));localStorage.setItem("kanban-users",JSON.stringify(getUsers().filter(x=>x!==name)));acctScreen("in")})})}
 (mode==="reset"?un:mode==="new"?un:(un.value?pw:un)).focus();
}
async function lockNow(){await chain;clearTimeout(tmr);DB=null;uid=null;dirty.clear();gone.clear();KEY=null;USER="";UP="";P={cur:0,next:1,projects:[]};S=seed();showHome=true;document.querySelectorAll(".ov,.pmenu").forEach(o=>{if(o.classList.contains("ov"))o.remove();else o.hidden=true});document.body.style.background="";document.getElementById("who").textContent="";fillPj();render();acctScreen("in")}
function pwDlg(){
 if(!KEY)return;
 const ov=$("div","ov"),m=$("div","modal");m.setAttribute("role","dialog");m.setAttribute("aria-label","Change password");
 const close=()=>ov.remove();ov.onclick=e=>{if(e.target===ov)close()};ov.onkeydown=e=>{if(e.key==="Escape")close()};
 const t=$("div",null,"Change password");t.style.fontWeight="700";
 const f=ph=>{const i=$("input","fld");i.type="password";i.placeholder=ph;i.setAttribute("aria-label",ph);return i};
 const c0=f("Current password"),n1=f("New password (6+ characters)"),n2=f("Repeat new password");c0.autocomplete="current-password";n1.autocomplete=n2.autocomplete="new-password";
 const err=$("div","err","");
 const cn=$("button","x","Cancel");cn.onclick=close;
 const ok=$("button","primary","Change password");
 const go=async()=>{err.textContent="";
  if(n1.value.length<6){err.textContent="Use at least 6 characters.";return}
  if(n1.value!==n2.value){err.textContent="The new passwords don't match.";return}
  ok.disabled=true;const a=getAcct(USER);
  try{await unwrapDek(a.wp,c0.value,ub64(a.salt))}catch(e){err.textContent="The current password isn't right.";ok.disabled=false;return}
  try{const salt=crypto.getRandomValues(new Uint8Array(16));a.wp=await wrapDek(KEY,n1.value,salt);a.salt=toB64(salt);
   localStorage.setItem(acctKey(USER),JSON.stringify(a));close();dlg("Password changed",{msg:"Your password has been updated. Your recovery code still works.",alert:true})}
  catch(e){err.textContent="Couldn't change the password.";ok.disabled=false}};
 ok.onclick=go;[c0,n1,n2].forEach(i=>{i.onkeydown=e=>{if(e.key==="Enter")go()}});
 const fr=$("div","row");fr.style.justifyContent="flex-end";fr.append(cn,ok);
 m.append(t,c0,n1,n2,err,fr);ov.append(m);document.body.append(ov);c0.focus();
}
document.getElementById("plock").onclick=lockNow;
document.getElementById("ppw").onclick=pwDlg;
function startAuth(){
 if(!(window.crypto&&crypto.subtle)){PLAIN=true;P=loadPlainP();["plock","ppw"].forEach(i=>{document.getElementById(i).style.display="none"});freeze(false);S=curP().data;showHome=true;fillPj();render();initDb();return}
 acctScreen("in")}
startAuth();
render();
</script>
